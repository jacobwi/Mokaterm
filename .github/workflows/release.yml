name: Release

on:
  push:
    tags: ['v*']
  # Publishes the plugin SDK packages of a release that already exists, when only the nuget.org step failed. It has to
  # live in this file: the nuget.org Trusted Publishing policy trusts release.yml and no other workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose NuGet packages to publish, for example v0.2.0
        required: true

permissions:
  contents: write
  # nuget.org Trusted Publishing: the push below trades GitHub's OIDC token for a key that lasts an hour, so no
  # long-lived NuGet key is stored anywhere.
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Package & Publish
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Mokaterm.slnx

      # The Windows head needs the win-x64 runtime pack, which a solution restore does not
      # fetch on a clean runner: MAUI settles the runtime identifier as the build runs, and
      # --no-restore then leaves the build unable to go and get it (NETSDK1112). Restoring the
      # host with the RID downloads it, and the build restores as well rather than being told
      # not to. Only this project takes the RID: forcing one on the solution would move every
      # test project's output and break the --no-build test run below.
      - name: Restore the desktop host for win-x64
        run: dotnet restore src/Hosts/Mokaterm.Maui/Mokaterm.Maui.csproj -r win-x64

      - name: Build
        run: dotnet build Mokaterm.slnx --configuration Release

      # A tag on a commit that does not pass is not a release. A failing run goes once more before the release stops:
      # timing-sensitive tests have flaked on busy runners (0.1.6 never published because of one), while a real failure
      # fails both runs.
      - name: Test
        shell: bash
        run: |
          dotnet test --solution Mokaterm.slnx --no-build --configuration Release || {
            echo "::warning::The test run failed; running it once more before giving up."
            dotnet test --solution Mokaterm.slnx --no-build --configuration Release
          }

      # Publishes the desktop host and packs it with Velopack into artifacts/windows. The
      # script targets Windows PowerShell, which is what the maintainer's machine has.
      #
      # Unsigned, so SmartScreen warns before Setup.exe runs. To sign later: add an
      # azure/login step for the signing service principal, write metadata.json from a
      # secret, and pass -AzureTrustedSignFile here. Give the script a --signExclude
      # ".*\.dll$" passthrough first, or one release spends ~400 signatures of the
      # monthly quota instead of the four exes that matter.
      - name: Package
        shell: powershell
        run: >
          ./build/package-windows.ps1
          -Version ${{ steps.version.outputs.version }}
          -GitHubRepoUrl ${{ github.server_url }}/${{ github.repository }}
          -GitHubToken ${{ github.token }}

      # Packs the plugin SDK and the template at a test version into a local feed, generates and builds every kind of
      # plugin the way an outside author would, and loads each through the real loader. A template that cannot produce
      # a working plugin is not published.
      - name: Check the plugin template
        shell: powershell
        run: ./build/test-plugin-template.ps1

      # What plugin authors build against, at this release's version: plugins record the major.minor they compiled
      # against, and the app only loads plugins built for its own.
      - name: Pack the plugin SDK
        shell: powershell
        run: ./build/pack-nuget.ps1 -Version ${{ steps.version.outputs.version }}

      # Only this version's packages: the output folder also holds the previous release's full package, which the
      # Package step downloads so vpk can build the delta, and which belongs to that release (v0.2.0 carried 0.1.9's).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-body.md
          generate_release_notes: true
          files: |
            artifacts/windows/Moka.Mokaterm-win-Setup.exe
            artifacts/windows/Moka.Mokaterm-win-Portable.zip
            artifacts/windows/Moka.Mokaterm-${{ steps.version.outputs.version }}-*.nupkg
            artifacts/windows/releases.win.json
            artifacts/windows/assets.win.json
            artifacts/windows/RELEASES
            artifacts/nuget/*.nupkg

      # After the release, so a release that failed to publish never leaves packages on nuget.org without it. The
      # nuget.org policy "Mokaterm releases" trusts this repository and this workflow file (release.yml): renaming the
      # file means updating the policy. The key lasts an hour, so it is asked for just before the push.
      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: BCat

      # One push per file: on the Windows runner dotnet nuget push did not expand a quoted pattern and found nothing,
      # which is what left 0.2.0 off nuget.org. --skip-duplicate lets a re-run finish instead of failing on what already
      # went up.
      - name: Publish the plugin SDK to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

  nuget:
    name: Publish the plugin SDK of an existing release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The packages the release workflow attached, so what goes to nuget.org is exactly what the release carries.
      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Mokaterm.*.nupkg' --dir artifacts/nuget
          ls artifacts/nuget/*.nupkg

      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: BCat

      - name: Publish the plugin SDK to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
