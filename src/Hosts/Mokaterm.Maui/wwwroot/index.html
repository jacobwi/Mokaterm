<!DOCTYPE html>
<html lang="en" data-mt-window-caption>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>Mokaterm</title>
	<base href="/" />
	<link rel="stylesheet" href="_content/Moka.Red.Core/moka-boot.css" />
	<link rel="stylesheet" href="_content/Moka.Red.Core/moka.css" />
	<link rel="stylesheet" href="_content/Mokaterm.UI/css/mokaterm.css" />
	<link rel="stylesheet" href="Mokaterm.Maui.styles.css" />
	<!-- The window draws its caption buttons over the top of the page at the tall height WindowChrome asks Windows for
	     (TitleBarHeightOption.Tall), so the top bar matches them, and toasts and dialogs (data-mt-window-caption above,
	     mokaterm.css) open below them. -->
	<style>
		:root {
			--mt-top-bar-height: 48px;
		}
	</style>
</head>
<body>
	<div id="app">
		<div class="moka-boot">
			<div class="moka-boot-brand">
				<div class="moka-boot-mark">mokaterm</div>
				<div class="moka-boot-subtitle">
					<span class="moka-boot-pulse"></span>
					<span>initializing runtime</span>
				</div>
				<div class="moka-boot-chips">
					<span>engine<span class="moka-boot-v">WEBVIEW2</span></span>
					<span>ui<span class="moka-boot-v">MOKA.RED</span></span>
				</div>
				<div class="moka-boot-bar"><span></span></div>
			</div>
		</div>
	</div>
	<div id="blazor-error-ui" style="display:none">
		An unhandled error has occurred.
		<a href="" class="reload">Reload</a>
	</div>
	<script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
